name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workflows
        run: pnpm lint:workflows

      - name: Check workspace policy
        run: pnpm quality:workspace

      - name: Check source
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build applications
        run: |
          pnpm build
          pnpm build:gateway
          pnpm build:worker

  docker:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            file: Dockerfile
            image: nekusora-web
          - component: gateway
            file: Dockerfile.gateway
            image: nekusora-gateway
          - component: worker
            file: Dockerfile.worker
            image: nekusora-worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha,scope=quality-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=quality-${{ matrix.component }}
