name: Publish Docker images

on:
  schedule:
    - cron: "17 */12 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.freshness.outputs.skip || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}

      - name: Check scheduled build freshness
        id: freshness
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          head_sha=$(git rev-parse HEAD)
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml/runs?branch=main&event=schedule&status=success&per_page=1"
          if response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url"); then
            last_sha=$(printf '%s' "$response" | jq -er '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
            if [ -n "$last_sha" ] && [ "$head_sha" = "$last_sha" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "main has no changes since the last successful scheduled publish"
            fi
          else
            echo "freshness query failed; continuing with the publish"
          fi

      - name: Set up pnpm
        if: steps.freshness.outputs.skip != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint workflows
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm lint:workflows

      - name: Check workspace policy
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm quality:workspace

      - name: Check source
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm check

      - name: Test
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm test

      - name: Build applications
        if: steps.freshness.outputs.skip != 'true'
        run: |
          pnpm build
          pnpm build:gateway
          pnpm build:worker

  ghcr_publish:
    needs: quality
    if: needs.quality.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            file: Dockerfile
            image: nekusora-web
          - component: gateway
            file: Dockerfile.gateway
            image: nekusora-gateway
          - component: worker
            file: Dockerfile.worker
            image: nekusora-worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=edge,branch=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push ${{ matrix.component }} image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.component }}

      - name: Record GHCR digest
        run: |
          echo "- GHCR ${{ matrix.image }}: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  dockerhub_sync:
    needs: ghcr_publish
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            file: Dockerfile
            image: nekusora-web
          - component: gateway
            file: Dockerfile.gateway
            image: nekusora-gateway
          - component: worker
            file: Dockerfile.worker
            image: nekusora-worker
    steps:
      - name: Check DockerHub credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        id: checkout
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        id: qemu
        if: steps.credentials.outputs.available == 'true' && steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        id: buildx
        if: steps.credentials.outputs.available == 'true' && steps.qemu.outcome == 'success'
        continue-on-error: true
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to DockerHub
        id: login
        if: steps.credentials.outputs.available == 'true' && steps.buildx.outcome == 'success'
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        if: steps.login.outcome == 'success'
        continue-on-error: true
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push DockerHub image
        id: push
        if: steps.meta.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ matrix.component }}

      - name: Record DockerHub result
        id: summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.credentials.outputs.available }}" != "true" ]; then
            echo "- DockerHub ${{ matrix.image }}: skipped (credentials not configured)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "- DockerHub ${{ matrix.image }}: published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- DockerHub ${{ matrix.image }}: failed (optional sync)" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish_summary:
    needs: [quality, ghcr_publish, dockerhub_sync]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record publish result
        shell: bash
        run: |
          echo "## Container publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR: ${{ needs.ghcr_publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.quality.outputs.skip }}" = "true" ]; then
            echo "- Scheduled publish: skipped (no new main commit)" >> "$GITHUB_STEP_SUMMARY"
            echo "- DockerHub: not applicable for schedule/manual publishing" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            echo "- DockerHub: not applicable for schedule/manual publishing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- DockerHub: see component summaries" >> "$GITHUB_STEP_SUMMARY"
          fi
