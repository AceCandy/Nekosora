name: Publish Docker images

on:
  schedule:
    - cron: "17 */12 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.freshness.outputs.skip || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}

      - name: Check scheduled build freshness
        id: freshness
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          head_sha=$(git rev-parse HEAD)
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml/runs?branch=main&event=schedule&status=success&per_page=1"
          if response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url"); then
            last_sha=$(printf '%s' "$response" | jq -er '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
            if [ -n "$last_sha" ] && [ "$head_sha" = "$last_sha" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "main has no changes since the last successful scheduled publish"
            fi
          else
            echo "freshness query failed; continuing with the publish"
          fi

      - name: Set up pnpm
        if: steps.freshness.outputs.skip != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint workflows
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm lint:workflows

      - name: Check workspace policy
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm quality:workspace

      - name: Check source
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm check

      - name: Test
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm test

      - name: Build applications
        if: steps.freshness.outputs.skip != 'true'
        run: |
          pnpm build
          pnpm build:gateway
          pnpm build:worker

  ghcr_build:
    needs: quality
    if: needs.quality.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/nekusora" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-nekusora-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-nekusora-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  ghcr_publish:
    needs: [quality, ghcr_build]
    if: needs.quality.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/nekusora" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=edge,branch=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Create multi-platform manifest
        id: manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected two platform digests, found ${#digests[@]}" >&2
            exit 1
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest.Digest}}' | jq -r .)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "- GHCR nekusora: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"

  dockerhub_sync:
    needs: ghcr_publish
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check DockerHub credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        id: buildx
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        id: ghcr_login
        if: steps.credentials.outputs.available == 'true' && steps.buildx.outcome == 'success'
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to DockerHub
        id: login
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        if: steps.login.outcome == 'success'
        continue-on-error: true
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/nekusora
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,format=short

      - name: Copy image to DockerHub
        id: push
        if: steps.meta.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          source="ghcr.io/${owner}/nekusora@${{ needs.ghcr_publish.outputs.digest }}"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "$source"

      - name: Record DockerHub result
        id: summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.credentials.outputs.available }}" != "true" ]; then
            echo "- DockerHub nekusora: skipped (credentials not configured)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "- DockerHub nekusora: published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- DockerHub nekusora: failed (optional sync)" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish_summary:
    needs: [quality, ghcr_publish, dockerhub_sync]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record publish result
        shell: bash
        run: |
          echo "## Container publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR: ${{ needs.ghcr_publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.quality.outputs.skip }}" = "true" ]; then
            echo "- Scheduled publish: skipped (no new main commit)" >> "$GITHUB_STEP_SUMMARY"
            echo "- DockerHub: not applicable for schedule/manual publishing" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            echo "- DockerHub: not applicable for schedule/manual publishing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- DockerHub: see image summary" >> "$GITHUB_STEP_SUMMARY"
          fi
