name: ✨ 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个功能解决了什么痛点?为谁解决?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 设想的方案
      description: 你希望它如何工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现方式?为什么选这个?

  - type: textarea
    id: context
    attributes:
      label: 补充信息
