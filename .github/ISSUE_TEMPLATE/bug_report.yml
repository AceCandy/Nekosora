name: 🐛 Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 Bug!请尽量填写完整,帮助我们快速定位。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简短地说明发生了什么问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小化复现路径
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 看到 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: "v0.1.0 或 commit hash"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker (GHCR 镜像)
        - Docker (自构建)
        - 本地开发 (pnpm dev)
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      render: shell
