<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nekusora">
  <!-- 背景:暮色微澜黑 -->
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>
  <!-- 星枢蓝渐变 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#9b7def"/>
    </linearGradient>
  </defs>
  <!-- 星轨:三层同心椭圆,象征「星枢」 -->
  <g fill="none" stroke="url(#g)" stroke-width="14" transform="translate(256 256)">
    <ellipse rx="180" ry="72" />
    <ellipse rx="180" ry="72" transform="rotate(60)"/>
    <ellipse rx="180" ry="72" transform="rotate(120)"/>
  </g>
  <!-- 中心星核:猫眼琥珀 -->
  <circle cx="256" cy="256" r="40" fill="#f5c97a"/>
</svg>
